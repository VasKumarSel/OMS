
server.port:8081
spring.application.name=order-service

spring.datasource.url=jdbc:postgresql://localhost:5432/marketdata_db
spring.datasource.username=marketdata_user
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=true
spring.jpa.hibernate.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization= true
spring.sql.init.mode=always

app.jwt.secret=mySecretKey123456789012345678901234567890
app.jwt.expiration=86400

app.market-data-service.url=http://localhost:8081
app.market-data-service.timeout=3000

app.temporal.server.host=localhost
app.temporal.server.port=7233
app.temporal.namespace=default
app.temporal.task-queue=order-processing

# Log levels
logging.level.com.oms.orderservice=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

# Log patterns
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n




